services:
  backend:
    image: ghcr.io/rileyberycz/dvdflix-backend:latest
    pull_policy: always
    command: ["python", "-m", "backend.run"]
    privileged: true
    device_cgroup_rules:
      - "b 11:* rmw"
      - "c 21:* rmw"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_ENV=production
      - MOVIES_PATH=${MOVIES_PATH:-/library/movies}
      - TV_PATH=${TV_PATH:-/library/tvshows}
      - TEMP_RIP_PATH=${TEMP_RIP_PATH:-/media/dvdflix/tmp}
    ports:
      - "7272:7272"
    volumes:
      - dvdflix-data:/app/data
      - ${MEDIA_ROOT_DIR:-/media/dvdflix}:/library
      - dvdflix-temp:/media/dvdflix/tmp
      - /dev:/dev
      - /run/udev:/run/udev:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:7272/api/healthcheck', timeout=10)"
      interval: 20s
      timeout: 12s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  dvdflix-data:
  dvdflix-temp:
